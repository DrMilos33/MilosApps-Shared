<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading-Screen-Referenz</title>
    <link rel="stylesheet" href="vendor/milosapps-essentials/v1/milos-app-essentials.css">
    <link rel="stylesheet" href="vendor/milosapps-essentials/v1/milos-app-essentials-theme.css">
  </head>
  <body data-milos-essentials-loading data-milos-essentials-app="reference-app">
    <section data-milos-app-loading role="status" aria-live="polite" aria-label="Reiseplaner wird geöffnet">
      <div data-milos-loading-card>
        <img data-milos-loading-icon src="icon.svg" width="52" height="52" alt="">
        <span data-milos-loading-brand>MilosApps</span>
        <h1 data-milos-loading-title>Reiseplaner</h1>
        <p data-milos-loading-message>Reiseplaner wird geöffnet …</p>
        <span data-milos-loading-progress aria-hidden="true"></span>
      </div>
    </section>
  </body>
</html>
