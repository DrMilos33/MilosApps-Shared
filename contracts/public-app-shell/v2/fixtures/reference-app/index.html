<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Shell-Referenz – MilosApps</title>
    <link rel="stylesheet" href="./app.css">
    <script type="module" src="./vendor/milosapps-shell/v2/bootstrap.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <milos-app-shell>
      <svg slot="app-icon" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="currentColor" opacity=".16"></circle>
        <path d="M20 7 23.7 16.3 33 20l-9.3 3.7L20 33l-3.7-9.3L7 20l9.3-3.7L20 7Z" fill="currentColor"></path>
      </svg>

      <main id="main" slot="main">
        <section class="hero" aria-labelledby="app-title">
          <p class="eyebrow" data-app-text="eyebrow">Frameworkneutrale Referenz</p>
          <h1 id="app-title" data-app-text="title">Eine Shell, viele unabhängige Apps</h1>
          <p class="intro" data-app-text="intro">
            Header, Footer und Sprache stammen aus einem gepinnten Build-Artefakt.
          </p>
          <div class="card">
            <strong data-app-text="cardTitle">App-eigener Inhalt</strong>
            <span data-app-text="cardText">Diese Fläche bleibt vollständig im App-Repository.</span>
          </div>
        </section>
      </main>
    </milos-app-shell>
  </body>
</html>
