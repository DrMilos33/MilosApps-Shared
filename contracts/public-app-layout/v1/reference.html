<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>public-app-layout/v1 Referenz</title>
    <link rel="stylesheet" href="./dist/milos-app-layout.css">
    <style>
      :root {
        --milos-layout-page: #f7f4ee;
        --milos-layout-surface: #ffffff;
        --milos-layout-surface-strong: #f0ece3;
        --milos-layout-text: #1f2523;
        --milos-layout-muted: #66706c;
        --milos-layout-border: #d8ddd9;
        --milos-layout-accent: #146b5a;
        --milos-layout-accent-contrast: #ffffff;
        --milos-layout-focus: #8b5cf6;
      }
      body { margin: 0; background: var(--milos-layout-page); font-family: system-ui, sans-serif; }
      input { width: 100%; padding: 0.7rem 0.85rem; border: 1px solid var(--milos-layout-border); border-radius: 0.875rem; }
      [data-milos-intro-icon] { border-radius: 1rem; color: var(--milos-layout-accent-contrast); background: var(--milos-layout-accent); font-weight: 800; }
    </style>
  </head>
  <body>
    <main data-milos-layout="compact" data-milos-profile="focused-task" data-milos-app-key="reference-app">
      <section data-milos-intro>
        <div data-milos-intro-copy>
          <p data-milos-eyebrow>Ein fokussierter Helfer</p>
          <h1>Die Aufgabe beginnt früh.</h1>
          <p data-milos-lead>Kurze Einordnung, klare Aktion, keine dekorative Wartestrecke.</p>
        </div>
        <div data-milos-intro-icon aria-hidden="true">M</div>
      </section>
      <section data-milos-primary-work data-milos-panel data-milos-stack>
        <div data-milos-step>
          <span data-milos-step-index>1</span>
          <div data-milos-stack>
            <h2>Was möchtest du prüfen?</h2>
            <label>Beispielwert <input value="Kompakt und verständlich"></label>
          </div>
        </div>
        <div data-milos-actions>
          <button data-milos-primary-action>Ergebnis zeigen</button>
          <button data-milos-secondary-action>Zurücksetzen</button>
        </div>
      </section>
      <details data-milos-secondary>
        <summary>Quellen und Einstellungen</summary>
        <section data-milos-settings>
          <div data-milos-settings-intro>
            <p data-milos-eyebrow>Auf diesem Gerät</p>
            <h2>Ruhig anpassen.</h2>
            <p>Wichtige Optionen bleiben erreichbar, ohne die Hauptaufgabe zu verdrängen.</p>
          </div>
          <div data-milos-settings-controls>
            <label data-milos-settings-control>Darstellung
              <select><option>Wie das Gerät</option><option>Hell</option><option>Dunkel</option></select>
            </label>
            <button data-milos-secondary-action data-milos-settings-danger>Lokale Daten löschen</button>
          </div>
        </section>
      </details>
    </main>
  </body>
</html>
